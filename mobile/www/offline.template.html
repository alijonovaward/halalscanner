<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>HalalScan — нет соединения</title>
    <style>
        :root { font-family: system-ui, -apple-system, sans-serif; color: #18201c; background: #f5f7f5; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        main { width: min(100%, 420px); padding: 28px; border-radius: 24px; background: white; box-shadow: 0 18px 50px rgb(24 32 28 / 10%); }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { color: #58615c; line-height: 1.5; overflow-wrap: anywhere; }
        button { width: 100%; min-height: 50px; margin-top: 12px; border: 0; border-radius: 14px; color: white; background: #16794b; font: inherit; font-weight: 700; }
    </style>
</head>
<body>
<main>
    <h1>Нет соединения</h1>
    <p>Проверьте, что телефон и компьютер находятся в одной Wi‑Fi сети, а HalalScan запущен по адресу {{SERVER_URL}}.</p>
    <button type="button" onclick="location.replace('{{SERVER_URL}}')">Повторить</button>
</main>
</body>
</html>
